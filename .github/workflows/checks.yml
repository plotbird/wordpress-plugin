name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header says 7.4, so that is the floor that has to keep
        # parsing. WordPress 6.0 supports it too.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Show the version under test
        run: php -v

      - name: Check every PHP file
        run: |
          set -o pipefail
          failed=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::syntax error"
              php -l "$file" || true
              failed=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $failed

      # The plugin directory rejects a submission whose main file points both
      # URIs at the same address, so the upload fails after the work is done.
      - name: Check the plugin header
        run: |
          set -euo pipefail
          plugin_uri=$(sed -n 's/^ \* Plugin URI: *//p' plotbird-analytics.php | tr -d '\r')
          author_uri=$(sed -n 's/^ \* Author URI: *//p' plotbird-analytics.php | tr -d '\r')
          text_domain=$(sed -n 's/^ \* Text Domain: *//p' plotbird-analytics.php | tr -d '\r')

          echo "plugin URI : ${plugin_uri}"
          echo "author URI : ${author_uri}"
          echo "textdomain : ${text_domain}"

          if [ -n "${plugin_uri}" ] && [ "${plugin_uri}" = "${author_uri}" ]; then
            echo "::error::the plugin URI and the author URI are the same address"
            exit 1
          fi

          if [ "${text_domain}" != "plotbird-analytics" ]; then
            echo "::error::the text domain must match the directory slug"
            exit 1
          fi

          echo "header ok"

      - name: Fail on a stray debugging call
        run: |
          set -o pipefail
          if grep -rn --include='*.php' -E '\b(var_dump|print_r|dd)\s*\(' .; then
            echo "::error::a debugging call is left in the code"
            exit 1
          fi
          echo "none found"

  zip:
    name: Release archive
    runs-on: ubuntu-latest
    needs: syntax
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # the archive is attached to the release

    steps:
      - uses: actions/checkout@v7

      - name: Build the archive WordPress expects
        run: |
          set -euo pipefail
          mkdir -p build/plotbird-analytics
          tar --exclude='./.git' --exclude='./build' --exclude='./.github' --exclude='./assets' \
              --exclude='./languages' --exclude='./.gitattributes' --exclude='./.gitignore' \
              --exclude='./README.md' --exclude='./CHANGELOG.md' -cf - . \
            | tar -xf - -C build/plotbird-analytics
          cd build && zip -qr plotbird-analytics.zip plotbird-analytics
          ls -lh plotbird-analytics.zip


      - name: No translation files in the archive
        run: |
          set -euo pipefail
          if unzip -l build/plotbird-analytics.zip | grep -E '\.(po|mo|pot)$|/languages/'; then
            echo "::error::the archive carries translation files; translate.wordpress.org generates them"
            exit 1
          fi
          echo "no translation files"
      - uses: actions/upload-artifact@v7
        with:
          name: plotbird-analytics
          path: build/plotbird-analytics.zip

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/plotbird-analytics.zip

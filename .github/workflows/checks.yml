name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header says 7.4, so that is the floor that has to keep
        # parsing. WordPress 6.0 supports it too.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Show the version under test
        run: php -v

      - name: Check every PHP file
        run: |
          set -o pipefail
          failed=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::syntax error"
              php -l "$file" || true
              failed=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $failed

      - name: Fail on a stray debugging call
        run: |
          set -o pipefail
          if grep -rn --include='*.php' -E '\b(var_dump|print_r|dd)\s*\(' .; then
            echo "::error::a debugging call is left in the code"
            exit 1
          fi
          echo "none found"

  zip:
    name: Release archive
    runs-on: ubuntu-latest
    needs: syntax
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # the archive is attached to the release

    steps:
      - uses: actions/checkout@v7

      - name: Build the archive WordPress expects
        run: |
          set -euo pipefail
          mkdir -p build/plotbird-analytics
          tar --exclude='./.git' --exclude='./build' --exclude='./.github' --exclude='./assets' -cf - . \
            | tar -xf - -C build/plotbird-analytics
          cd build && zip -qr plotbird-analytics.zip plotbird-analytics
          ls -lh plotbird-analytics.zip

      - uses: actions/upload-artifact@v7
        with:
          name: plotbird-analytics
          path: build/plotbird-analytics.zip

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/plotbird-analytics.zip
